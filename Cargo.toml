[package]
name = "loom"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local SDK declarations for your shell"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
toml = "0.8"

console = "0.16"
